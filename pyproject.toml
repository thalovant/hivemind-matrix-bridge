[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "HiveMind-matrix-bridge"
description = "Matrix bridge for HiveMind: answer Matrix rooms from a HiveMind node"
readme = "README.md"
authors = [{ name = "jarbasAI", email = "jarbasai@mailfence.com" }]
# The LICENSE file in this repository is Apache-2.0.
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    # bounded handshake retries and a ConnectionRefusedError on refused credentials
    "hivemind-bus-client>=1.0.16a1",
    "ovos-bus-client>=2.9.1a1",
    "ovos-utils>=0.13.15a1",
    # the Matrix client-server API is spoken directly (hm_matrix_bridge/matrix.py)
    "requests>=2.28",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/thalovant/hivemind-matrix-bridge"

[project.scripts]
hivemind-matrix-bridge = "hm_matrix_bridge.__main__:main"

[tool.setuptools]
packages = ["hm_matrix_bridge"]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "hm_matrix_bridge.version.__version__" }
